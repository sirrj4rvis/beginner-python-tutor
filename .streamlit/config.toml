# Streamlit settings for this project (read automatically when the app is started from D:\GEN AI).
[client]
toolbarMode = "viewer"       # keep the ⋮ menu (Settings, theme) but hide "Deploy" and developer items

[browser]
gatherUsageStats = false     # do not send usage statistics to Streamlit

# ---- Design system ("paper & ink"): one look in light and dark mode --------------------------
# Fonts: Inter for text, Fraunces (an editorial serif) for headings, JetBrains Mono for code.
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap, serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [600, 600, 600, 600, 500, 500]
baseFontSize = 15
baseRadius = "0.6rem"
buttonRadius = "0.55rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#1F3A68"             # Oxford navy: buttons, focus, selected options
backgroundColor = "#FAF8F3"          # warm paper
secondaryBackgroundColor = "#F1EDE4" # inputs, code blocks
textColor = "#1B1B1F"                # ink
borderColor = "#E3DDD0"
linkColor = "#1F3A68"
codeBackgroundColor = "#F1EDE4"
codeTextColor = "#7A4A0E"

[theme.light.sidebar]
backgroundColor = "#F3EFE6"
secondaryBackgroundColor = "#FBF9F4"
borderColor = "#E3DDD0"

[theme.dark]
primaryColor = "#9DB6E4"             # soft blue, readable on charcoal
backgroundColor = "#111214"
secondaryBackgroundColor = "#1A1B1F"
textColor = "#ECE9E2"                # ivory
borderColor = "#2B2C32"
linkColor = "#9DB6E4"
codeBackgroundColor = "#1A1B1F"
codeTextColor = "#E2BD78"

[theme.dark.sidebar]
backgroundColor = "#0C0D0F"
secondaryBackgroundColor = "#17181C"
borderColor = "#24252A"
